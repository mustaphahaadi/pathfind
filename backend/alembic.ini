# Alembic configuration file.
# This file is read by `alembic` and controls migration behaviour.

[alembic]
# Path to the migration scripts directory, relative to this file
script_location = backend/migrations
prepend_sys_path = .

# Template for new revision filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision file timestamps
timezone = UTC

# Database URL — overridden at runtime by env.py reading DATABASE_URL
sqlalchemy.url = sqlite:///./pathfind.db

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
